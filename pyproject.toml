[project]
name = "rag-eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anush Bharathwaj", email = "anushbharathwaj.l@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.19",
    "deepeval>=4.2.6",
    "dotenv>=0.9.9",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.6",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pymupdf>=1.28.2",
    "streamlit>=1.64.0",
]

[project.scripts]
rag-eval = "rag_eval:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
